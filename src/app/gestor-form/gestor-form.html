<div class="w-full min-h-screen flex flex-col p-8 items-center bg-gray-50">
  <div class="w-full max-w-2xl bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mt-4">
    <div class="bg-gray-800 px-8 py-5 border-b-4 border-yellow-500">
      <h2 class="text-xl font-bold text-white m-0">
        @if (idGestorEdicao) { Editar Gestor } @else { Cadastrar Novo Gestor }
      </h2>
      <p class="text-gray-400 text-sm mt-1 mb-0">
        @if (idGestorEdicao) { Atualize os dados do administrador. } @else { Insira as credenciais do novo administrador. }
      </p>
    </div>

    <form [formGroup]="formulario" (ngSubmit)="salvar()" class="p-8">
      @if (mensagemErro) {
        <div class="bg-red-50 text-red-600 border border-red-200 text-xs p-3 rounded-lg mb-6 text-center font-medium">
          {{ mensagemErro }}
        </div>
      }

      <div class="grid grid-cols-1 gap-6">
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2">Nome de Usuário *</label>
          <input type="text" formControlName="nome" (input)="mensagemErro = ''" placeholder="Ex: admin_joao"
                 class="w-full px-4 py-2 border rounded focus:ring-2 outline-none transition-colors"
                 [ngClass]="{'border-red-500': formulario.get('nome')?.invalid && formulario.get('nome')?.touched, 'border-gray-300 focus:ring-yellow-500': !formulario.get('nome')?.invalid || !formulario.get('nome')?.touched}">
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2">
            @if (idGestorEdicao) {
              Senha de Acesso (Deixe em branco para manter a atual)
            } @else {
              Senha de Acesso *
            }
          </label>
          
          <div class="relative">
            <input [type]="mostrarSenha ? 'text' : 'password'" formControlName="senha" placeholder="********"
                   class="w-full px-4 py-2 pr-10 border rounded focus:ring-2 outline-none transition-colors"
                   [ngClass]="{'border-red-500': formulario.get('senha')?.invalid && formulario.get('senha')?.touched && !idGestorEdicao, 'border-gray-300 focus:ring-yellow-500': !(formulario.get('senha')?.invalid && formulario.get('senha')?.touched && !idGestorEdicao)}">
            
            <button type="button" (click)="mostrarSenha = !mostrarSenha" 
                    class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600 focus:outline-none cursor-pointer">
              @if (mostrarSenha) {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
              } @else {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>
              }
            </button>
          </div>
        </div>

      </div> 

      <div class="mt-8 flex justify-end gap-4 pt-6 border-t border-gray-100">
        <button type="button" routerLink="/gestores" class="px-6 py-2 text-gray-600 font-bold hover:bg-gray-50 rounded transition-colors cursor-pointer">Cancelar</button>
        <button type="submit" class="px-6 py-2 bg-yellow-500 text-gray-900 font-bold rounded hover:bg-yellow-400 transition-colors shadow-sm cursor-pointer">
          @if (idGestorEdicao) { Atualizar Gestor } @else { Salvar Gestor }
        </button>
      </div>
    </form>
  </div>
</div>
