<div class="min-h-screen w-full bg-gray-950 flex flex-col justify-center items-center p-4">
  
  <div class="w-full max-w-md bg-gray-900 rounded-2xl shadow-2xl border border-gray-800 p-8">
    
    <div class="flex justify-center mb-8">
      <img src="icon.png" alt="Silva & Souza" class="h-24 w-auto object-contain">
    </div>

    <div class="text-center mb-6">
      <h2 class="text-xl font-bold text-white tracking-tight">Controle de Frota e Logística</h2>
      <p class="text-gray-400 text-xs mt-1">Insira as suas credenciais para acessar ao sistema.</p>
    </div>

    @if (mensagemErro()) {
      <div class="bg-red-500/15 border border-red-500 text-red-400 px-4 py-3 rounded-xl mb-6 text-sm text-center font-semibold animate-in fade-in zoom-in duration-200 flex items-center justify-center gap-2">
        <svg class="w-5 h-5 flex-shrink-0 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        <span>{{ mensagemErro() }}</span>
      </div>
    }
    
    <form [formGroup]="formularioLogin" (ngSubmit)="entrar()" class="space-y-5">
      
      <div>
        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Utilizador / Nome</label>
        <input type="text" formControlName="usuario" placeholder="Digite o seu nome"
               class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 outline-none transition-all text-sm">
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Senha de Acesso</label>
  
  <div class="relative">
    <input [type]="mostrarSenha ? 'text' : 'password'" 
           formControlName="senha" 
           placeholder="••••••••••••"
           class="w-full px-4 py-3 pr-12 bg-gray-800/80 border border-gray-700 rounded-lg text-white focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 outline-none transition-colors">
    
    <button type="button" 
            (click)="mostrarSenha = !mostrarSenha"
            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-yellow-500 transition-colors cursor-pointer outline-none">
      
      @if (!mostrarSenha) {
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
        </svg>
      }
    </button>
  </div>
      </div>
<div class="flex items-center justify-between mb-6 mt-2">
  <label class="flex items-center text-sm text-gray-400 cursor-pointer hover:text-gray-300 transition-colors">
    <input type="checkbox" formControlName="lembrar" class="mr-2 rounded bg-gray-700 border-gray-600 text-yellow-500 focus:ring-yellow-500">
    Manter conectado
  </label>
  <a href="https://wa.me/5518997435931?text=Olá,%20esqueci%20a%20minha%20senha%20do%20sistema%20da%20transportadora." 
     target="_blank" 
     class="text-sm text-yellow-500 hover:text-yellow-400 transition-colors font-medium">
    Esqueci a senha
  </a>
</div>

      <div class="pt-2">
        <button type="submit" [disabled]="carregando()"
                class="w-full py-3 bg-yellow-500 text-gray-950 font-bold rounded-lg hover:bg-yellow-400 transition-colors disabled:opacity-40 disabled:cursor-not-allowed shadow-md text-sm uppercase tracking-wider cursor-pointer flex items-center justify-center gap-2">
          @if (carregando()) {
            <svg class="animate-spin h-5 w-5 text-gray-950" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
            Entrando...
          } @else {
            Entrar no Sistema
          }
        </button>
      </div>

    </form>

    <div class="mt-8 text-center border-t border-gray-800 pt-4">
      <p class="text-xs text-gray-500">Silva & Souza &copy; 2026</p>
    </div>

  </div>
</div>
